<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="image" href="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6995fb83472e84f2aaa7251a/77a5e07ff_lefi_logo.png" fetchpriority="high" />
    <script>
      // Break redirect loop: if from_url points back to /login, reset it to /
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var fromUrl = params.get('from_url');
          if (fromUrl && decodeURIComponent(fromUrl).includes('/login')) {
            params.set('from_url', window.location.origin + '/');
            var newSearch = params.toString();
            window.history.replaceState({}, '', window.location.pathname + (newSearch ? '?' + newSearch : '') + window.location.hash);
          }
        } catch(e) {}

        // Theme apply
        var html = document.documentElement;
        var isAndroid = /android/i.test(navigator.userAgent);
        try {
          if (isAndroid) {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              html.classList.add('dark');
            }
          } else {
            var stored = localStorage.getItem('theme');
            if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
              html.classList.add('dark');
            } else {
              html.classList.remove('dark');
            }
          }
        } catch(e) {}
      })();
    </script>
    <title>Lefi - AI Image Generator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
