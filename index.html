<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="image" href="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6995fb83472e84f2aaa7251a/77a5e07ff_lefi_logo.png" fetchpriority="high" />
    <!-- Blocking theme script: apply dark class before first paint to guarantee zero-FOUC -->
    <script>
      (function() {
        var html = document.documentElement;
        function applyTheme() {
          try {
            var isAndroid = /android/i.test(navigator.userAgent);
            // On Android: always honour system preference; ignore localStorage to avoid stale cache
            if (isAndroid) {
              var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              if (prefersDark) html.classList.add('dark');
              return;
            }
            // Non-Android: check saved preference, fallback to system
            var stored = localStorage.getItem('theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (stored === 'dark' || (!stored && prefersDark)) {
              html.classList.add('dark');
            } else {
              html.classList.remove('dark');
            }
          } catch(e) {
            // Fail safely: no theme class applied
          }
        }
        applyTheme();
      })();
    </script>
    <title>Lefi - AI Image Generator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
