<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="image" href="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6995fb83472e84f2aaa7251a/77a5e07ff_lefi_logo.png" fetchpriority="high" />
    <!-- Blocking theme script: apply dark class before first paint to avoid FOUC -->
    <script>
      (function() {
        try {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isAndroid = /android/i.test(navigator.userAgent);
          // On Android WebView always honour system preference; ignore stored setting.
          var stored = isAndroid ? null : localStorage.getItem('theme');
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <title>Lefi - AI Image Generator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
